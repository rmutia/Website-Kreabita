<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreabita - Portal Edukasi Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Neo-Brutalist Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #fff;
            border-left: 2px solid #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #000;
            border: 2px solid #fff;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333;
        }
        
        /* Brutalist Utilities */
        .brutal-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        }
        .brutal-shadow-sm {
            box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
        }
        .brutal-shadow-lg {
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
        }
        .pattern-grid {
            background-image: linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center center;
            opacity: 0.1;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes pixel-rain {
            0% { transform: translateY(-100%) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(180deg); opacity: 0; }
        }
        .pixel {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid black;
            opacity: 0;
            animation: pixel-rain 6s linear infinite;
        }
        .pixel:nth-child(1) { left: 10%; animation-delay: 0s; background: #fb923c; } /* Orange */
        .pixel:nth-child(2) { left: 30%; animation-delay: 2s; background: #f472b6; } /* Pink */
        .pixel:nth-child(3) { left: 70%; animation-delay: 1s; background: #34d399; } /* Green */
        .pixel:nth-child(4) { left: 90%; animation-delay: 4s; background: #38bdf8; } /* Blue */
        .pixel:nth-child(5) { left: 50%; animation-delay: 3s; background: #fb923c; } 
    </style>
<script type="importmap">
{
  "imports": {
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
</head>
<body class="bg-gray-50 text-black selection:bg-black selection:text-white min-h-screen">
    <div id="root"></div>
</body>
</html>
